<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Store – Shop Electronics, Fashion, Home & More</title>

  <!-- CleverTap Visual Editor prerequisites (best-effort via meta; set as HTTP headers in production) -->
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'self' https://*.clevertap.com https://*.clevertap-prod.com">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Demo Store">

  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --primary-soft: #EFF6FF;
      --accent: #F97316;
      --text: #111827;
      --muted: #6B7280;
      --bg: #F3F4F6;
      --card: #FFFFFF;
      --border: #E5E7EB;
      --success: #059669;
      --danger: #DC2626;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
    a { color: var(--primary); text-decoration: none; cursor: pointer; }
    button { font-family: inherit; }

    .topbar { background: #111827; color: #D1D5DB; font-size: 13px; text-align: center; padding: 8px 12px; }
    .topbar b { color: #fff; }

    .header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .header-row { max-width: 1200px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 18px; }
    .logo { font-size: 22px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .logo i { font-style: normal; background: var(--primary); color: #fff; width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
    .search { flex: 1; display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); }
    .search input { flex: 1; border: 0; background: transparent; padding: 10px 14px; font-size: 14px; outline: none; }
    .search button { border: 0; background: var(--primary); color: #fff; padding: 0 18px; cursor: pointer; font-weight: 600; }
    .hdr-actions { display: flex; align-items: center; gap: 6px; }
    .hbtn { background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text); position: relative; display: inline-flex; align-items: center; gap: 6px; }
    .hbtn:hover { background: var(--bg); }
    .cart-count { background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; font-weight: 700; }
    .bell-badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; background: var(--danger); color: #fff; border-radius: 999px; font-size: 10px; font-weight: 700; display: none; align-items: center; justify-content: center; }
    .bell-badge.show { display: inline-flex; }
    .catnav { max-width: 1200px; margin: 0 auto; padding: 0 20px 10px; display: flex; gap: 4px; overflow-x: auto; }
    .catnav a { color: var(--muted); font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 6px; white-space: nowrap; }
    .catnav a:hover, .catnav a.active { background: var(--primary-soft); color: var(--primary); }

    main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; min-height: 60vh; }
    h1.page-title { font-size: 26px; margin: 0 0 18px; }
    .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

    .hero { background: linear-gradient(120deg, #1E3A8A, #2563EB 60%, #38BDF8); color: #fff; border-radius: 16px; padding: 44px 40px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .hero h1 { margin: 0 0 10px; font-size: 34px; }
    .hero p { margin: 0 0 20px; opacity: .92; max-width: 460px; }
    .hero .emoji { font-size: 90px; }

    .btn { border: 0; border-radius: 8px; padding: 11px 20px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; } .btn-primary:hover { background: var(--primary-dark); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-light { background: #fff; color: var(--primary); }
    .btn-ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    .btn-block { width: 100%; }

    .section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 34px 0 14px; }
    .section-title h2 { margin: 0; font-size: 20px; }

    .cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    .cat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 10px; text-align: center; cursor: pointer; transition: .15s; }
    .cat-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.07); }
    .cat-card .ic { font-size: 38px; } .cat-card div:last-child { font-weight: 700; margin-top: 8px; font-size: 14px; }

    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .pcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: .15s; }
    .pcard:hover { box-shadow: 0 8px 22px rgba(0,0,0,.09); transform: translateY(-2px); }
    .pimg { height: 170px; display: flex; align-items: center; justify-content: center; font-size: 72px; }
    .pbody { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .pcat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
    .pname { font-weight: 600; font-size: 15px; }
    .rating { font-size: 12px; color: #F59E0B; } .rating span { color: var(--muted); }
    .price { font-size: 18px; font-weight: 800; } .price s { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
    .off { color: var(--success); font-size: 12px; font-weight: 700; margin-left: 6px; }
    .pcard .btn { margin-top: auto; }

    .perks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 34px; }
    .perk { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; font-size: 14px; } .perk b { display: block; margin-bottom: 4px; }

    .pdp { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
    .pdp .pimg { height: 380px; border-radius: 12px; font-size: 150px; }
    .pdp h1 { margin: 6px 0 10px; font-size: 28px; }
    .pdp .price { font-size: 30px; margin: 14px 0; }
    .pdp p { color: var(--muted); line-height: 1.6; }
    .qty { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; }
    .qty button { border: 0; background: none; width: 32px; height: 34px; font-size: 18px; cursor: pointer; }
    .qty span { min-width: 28px; text-align: center; font-weight: 600; }

    .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; max-width: 440px; margin: 20px auto; }
    .form-card h1 { margin: 0 0 6px; font-size: 24px; } .form-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
    input[type=text], input[type=email], input[type=tel], input[type=password], select, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; background: #fff; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }
    .alt { text-align: center; font-size: 14px; color: var(--muted); margin-top: 16px; }

    .checkout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; align-items: start; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
    .panel h2 { margin: 0 0 6px; font-size: 18px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tag { display: inline-block; background: var(--primary-soft); color: var(--primary); border-radius: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; }
    .sum-line { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; }
    .sum-line.total { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 12px; font-size: 18px; font-weight: 800; }
    .mini { display: flex; gap: 12px; align-items: center; padding: 8px 0; font-size: 14px; }
    .mini .em { font-size: 28px; width: 46px; height: 46px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .mini .grow { flex: 1; }

    .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: none; }
    .drawer-bg.show { display: block; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100%; background: #fff; z-index: 101; transform: translateX(100%); transition: transform .25s; display: flex; flex-direction: column; }
    .drawer.show { transform: none; }
    .drawer-head { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 18px; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 8px 20px; }
    .drawer-foot { padding: 16px 20px; border-top: 1px solid var(--border); }
    .x { background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 50px 10px; }
    .rm { color: var(--danger); font-size: 12px; cursor: pointer; background: none; border: 0; padding: 0; }

    .success { text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 44px 24px; max-width: 560px; margin: 20px auto; }
    .success .big { font-size: 60px; }

    footer { background: #111827; color: #9CA3AF; text-align: center; padding: 26px; font-size: 13px; }
    .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 11px 22px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 300; }
    .toast.show { opacity: 1; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); } .cats { grid-template-columns: repeat(3, 1fr); }
      .pdp, .checkout { grid-template-columns: 1fr; } .perks { grid-template-columns: 1fr; }
      .header-row { flex-wrap: wrap; } .search { order: 3; flex-basis: 100%; }
      .hero { flex-direction: column; text-align: center; padding: 30px 20px; } .hero .emoji { font-size: 60px; }
    }
  </style>

      s.parentNode.insertBefore(wzrk, s);

</head>

<body>
  <div class="topbar">🚚 <b>Free shipping</b> on orders over $100 · Use code <b>WELCOME10</b> (demo)</div>

  <header class="header">
    <div class="header-row">
      <div class="logo" onclick="go('/')"><i>D</i> Demo Store</div>
      <div class="search">
        <input id="searchInput" type="text" placeholder="Search products…" onkeydown="if(event.key==='Enter')doSearch()">
        <button onclick="doSearch()">Search</button>
      </div>
      <div class="hdr-actions">
        <button class="hbtn" onclick="enablePush()" title="Enable push">🔔 Push</button>
        <button class="hbtn" id="notification_bell" title="Notifications">
          ✉️<span id="notification_bell_badge" class="bell-badge">0</span>
        </button>
        <span id="authArea"></span>
        <button class="hbtn" onclick="openCart()">🛒 Cart <span class="cart-count" id="cartCount">0</span></button>
      </div>
    </div>
    <nav class="catnav" id="catNav"></nav>
  </header>

  <main id="app"></main>

  <footer>© 2026 Demo Store · A demo website for CleverTap integration testing. No real payments are processed.</footer>

  <div class="drawer-bg" id="drawerBg" onclick="closeCart()"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">Your cart <button class="x" onclick="closeCart()">×</button></div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script>
    // ───────── Data ─────────
    const categories = [
      { id: 'electronics', name: 'Electronics',    icon: '🎧', bg: '#DBEAFE' },
      { id: 'fashion',     name: 'Fashion',        icon: '👟', bg: '#FCE7F3' },
      { id: 'home',        name: 'Home & Kitchen', icon: '☕', bg: '#FEF3C7' },
      { id: 'beauty',      name: 'Beauty',         icon: '🧴', bg: '#EDE9FE' },
      { id: 'sports',      name: 'Sports',         icon: '🏀', bg: '#DCFCE7' },
    ];
    const products = [
      { id: 'p1',  cat: 'electronics', name: 'Wireless Noise-Cancelling Headphones', icon: '🎧', price: 129.99, mrp: 179.99, rating: 4.6, reviews: 1280, desc: 'Over-ear Bluetooth headphones with active noise cancellation and 30-hour battery life.' },
      { id: 'p2',  cat: 'electronics', name: 'Smart Watch Series 5',                 icon: '⌚', price: 199.00, mrp: 249.00, rating: 4.4, reviews: 860,  desc: 'Track workouts, heart rate and sleep with a bright always-on AMOLED display.' },
      { id: 'p3',  cat: 'electronics', name: 'Portable Bluetooth Speaker',           icon: '🔊', price: 49.99,  mrp: 69.99,  rating: 4.3, reviews: 540,  desc: 'Waterproof speaker with deep bass and 12 hours of playtime.' },
      { id: 'p4',  cat: 'electronics', name: 'Mirrorless Camera Kit',                icon: '📷', price: 649.00, mrp: 799.00, rating: 4.7, reviews: 310,  desc: '24MP mirrorless camera with 18-55mm lens, 4K video and Wi-Fi sharing.' },
      { id: 'p5',  cat: 'fashion',     name: 'Classic Running Sneakers',             icon: '👟', price: 79.00,  mrp: 110.00, rating: 4.5, reviews: 2210, desc: 'Lightweight, breathable sneakers designed for everyday comfort.' },
      { id: 'p6',  cat: 'fashion',     name: 'Leather Crossbody Bag',                icon: '👜', price: 89.50,  mrp: 120.00, rating: 4.2, reviews: 430,  desc: 'Genuine leather bag with adjustable strap and zip closure.' },
      { id: 'p7',  cat: 'fashion',     name: 'Aviator Sunglasses',                   icon: '🕶️', price: 34.99,  mrp: 59.99,  rating: 4.1, reviews: 700,  desc: 'UV400 polarized lenses with a lightweight metal frame.' },
      { id: 'p8',  cat: 'fashion',     name: 'Denim Jacket',                         icon: '🧥', price: 64.00,  mrp: 85.00,  rating: 4.4, reviews: 390,  desc: 'Timeless washed-denim jacket with a relaxed modern fit.' },
      { id: 'p9',  cat: 'home',        name: 'Automatic Coffee Maker',               icon: '☕', price: 89.99,  mrp: 119.99, rating: 4.5, reviews: 980,  desc: 'Programmable 12-cup coffee maker with built-in grinder.' },
      { id: 'p10', cat: 'home',        name: 'Non-Stick Cookware Set (10 pc)',       icon: '🍳', price: 119.00, mrp: 160.00, rating: 4.6, reviews: 1500, desc: 'Durable non-stick pots and pans, induction compatible.' },
      { id: 'p11', cat: 'home',        name: 'Scented Soy Candle Trio',              icon: '🕯️', price: 24.99,  mrp: 34.99,  rating: 4.8, reviews: 620,  desc: 'Three hand-poured soy candles in calming lavender, vanilla and cedar.' },
      { id: 'p12', cat: 'home',        name: 'Ergonomic Desk Lamp',                  icon: '💡', price: 39.99,  mrp: 54.99,  rating: 4.3, reviews: 270,  desc: 'LED desk lamp with 5 brightness levels and USB charging port.' },
      { id: 'p13', cat: 'beauty',      name: 'Vitamin C Face Serum',                 icon: '🧴', price: 22.00,  mrp: 30.00,  rating: 4.4, reviews: 1800, desc: 'Brightening serum with 15% vitamin C and hyaluronic acid.' },
      { id: 'p14', cat: 'beauty',      name: 'Matte Lipstick Collection',            icon: '💄', price: 29.99,  mrp: 45.00,  rating: 4.2, reviews: 940,  desc: 'Set of 4 long-wear matte lipsticks in everyday shades.' },
      { id: 'p15', cat: 'sports',      name: 'Non-Slip Yoga Mat',                    icon: '🧘', price: 27.50,  mrp: 40.00,  rating: 4.5, reviews: 1120, desc: 'Extra-thick eco-friendly yoga mat with carry strap.' },
      { id: 'p16', cat: 'sports',      name: 'Pro Basketball (Size 7)',              icon: '🏀', price: 32.00,  mrp: 45.00,  rating: 4.6, reviews: 510,  desc: 'Indoor/outdoor composite leather basketball with great grip.' },
    ];
    const catById = id => categories.find(c => c.id === id);
    const prodById = id => products.find(p => p.id === id);
    const money = n => '$' + Number(n).toFixed(2);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const SHIPPING_FREE_OVER = 100, SHIPPING_FEE = 5.99;

    // ───────── State (persisted in localStorage) ─────────
    function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } }
    function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
    let cart = load('demo_cart', []);          // [{id, qty}]
    let users = load('demo_users', []);        // demo-only local accounts
    let session = load('demo_session', null);  // {name,email,phone}

    // ───────── CleverTap helpers ─────────
    function trackEvent(name, props) {
      try {
        if (window.clevertap && window.clevertap.event) window.clevertap.event.push(name, props || {});
        console.log('[CT event]', name, props || {});
      } catch (e) { console.warn('CT trackEvent failed', e); }
    }
    function ctLogin(profile) {
      try { window.clevertap.onUserLogin.push({ Site: profile }); } catch (e) {}
      console.log('[CT onUserLogin]', profile);
    }
    function productProps(p) {
      return { product_id: p.id, product_name: p.name, category: catById(p.cat).name, price: p.price, mrp: p.mrp };
    }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // ───────── Cart ─────────
    function cartTotals() {
      const subtotal = cart.reduce((s, i) => s + prodById(i.id).price * i.qty, 0);
      const shipping = cart.length && subtotal < SHIPPING_FREE_OVER ? SHIPPING_FEE : 0;
      return { subtotal, shipping, total: subtotal + shipping, items: cart.reduce((s, i) => s + i.qty, 0) };
    }
    function addToCart(id, qty) {
      qty = qty || 1;
      const p = prodById(id);
      const line = cart.find(i => i.id === id);
      if (line) line.qty += qty; else cart.push({ id, qty });
      save('demo_cart', cart); renderCart();
      trackEvent('Added to Cart', { ...productProps(p), quantity: qty, cart_value: cartTotals().subtotal });
      showToast('Added to cart');
    }
    function changeQty(id, delta) {
      const line = cart.find(i => i.id === id); if (!line) return;
      line.qty += delta;
      if (line.qty <= 0) return removeFromCart(id);
      save('demo_cart', cart); renderCart();
    }
    function removeFromCart(id) {
      const p = prodById(id);
      cart = cart.filter(i => i.id !== id);
      save('demo_cart', cart); renderCart();
      trackEvent('Removed from Cart', productProps(p));
    }
    function renderCart() {
      const t = cartTotals();
      document.getElementById('cartCount').textContent = t.items;
      document.getElementById('drawerBody').innerHTML = cart.length ? cart.map(i => {
        const p = prodById(i.id);
        return `<div class="mini">
          <div class="em" style="background:${catById(p.cat).bg}">${p.icon}</div>
          <div class="grow"><div style="font-weight:600">${esc(p.name)}</div>
            <div style="color:var(--muted)">${money(p.price)}</div>
            <div style="margin-top:6px" class="qty"><button onclick="changeQty('${p.id}',-1)">−</button><span>${i.qty}</span><button onclick="changeQty('${p.id}',1)">+</button></div>
          </div>
          <div style="text-align:right"><b>${money(p.price * i.qty)}</b><br><button class="rm" onclick="removeFromCart('${p.id}')">Remove</button></div>
        </div>`;
      }).join('') : '<div class="empty"><div style="font-size:48px">🛒</div>Your cart is empty</div>';
      document.getElementById('drawerFoot').innerHTML = cart.length ? `
        <div class="sum-line"><span>Subtotal</span><b>${money(t.subtotal)}</b></div>
        <button class="btn btn-primary btn-block" onclick="startCheckout()">Proceed to checkout</button>` : '';
    }
    function openCart() {
      document.getElementById('drawer').classList.add('show');
      document.getElementById('drawerBg').classList.add('show');
      trackEvent('Cart Viewed', { item_count: cartTotals().items, cart_value: cartTotals().subtotal });
    }
    function closeCart() {
      document.getElementById('drawer').classList.remove('show');
      document.getElementById('drawerBg').classList.remove('show');
    }
    function startCheckout() { closeCart(); go('/checkout'); }

    // ───────── Router ─────────
    function go(path) { if (location.hash === '#' + path) route(); else location.hash = path; }
    window.addEventListener('hashchange', route);

    function route() {
      const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
      const [page, arg] = parts;
      const app = document.getElementById('app');
      window.scrollTo(0, 0);
      document.querySelectorAll('.catnav a').forEach(a => a.classList.toggle('active', page === 'category' && a.dataset.id === arg));

      if (!page) return viewHome(app);
      if (page === 'category') return viewCategory(app, decodeURIComponent(arg || ''));
      if (page === 'search') return viewSearch(app, decodeURIComponent(arg || ''));
      if (page === 'product') return viewProduct(app, arg);
      if (page === 'checkout') return viewCheckout(app);
      if (page === 'order') return viewOrder(app, arg);
      if (page === 'login') return viewLogin(app);
      if (page === 'register') return viewRegister(app);
      viewHome(app);
    }
    function pageViewed(name, extra) {
      trackEvent('Page Viewed', Object.assign({ page_name: name, url: location.href, logged_in: !!session }, extra || {}));
    }

    // ───────── Views ─────────
    function productCard(p) {
      const off = Math.round((1 - p.price / p.mrp) * 100);
      return `<div class="pcard" onclick="go('/product/${p.id}')">
        <div class="pimg" style="background:${catById(p.cat).bg}">${p.icon}</div>
        <div class="pbody">
          <div class="pcat">${catById(p.cat).name}</div>
          <div class="pname">${esc(p.name)}</div>
          <div class="rating">★ ${p.rating} <span>(${p.reviews})</span></div>
          <div class="price">${money(p.price)}<s>${money(p.mrp)}</s><span class="off">${off}% off</span></div>
          <button class="btn btn-primary" onclick="event.stopPropagation();addToCart('${p.id}')">Add to cart</button>
        </div></div>`;
    }

    function viewHome(app) {
      app.innerHTML = `
        <div class="hero" id="heroBanner">
          <div>
            <h1 id="heroTitle">Big savings on everyday essentials</h1>
            <p id="heroBody">Shop top-rated electronics, fashion, home and more. Free shipping over $100.</p>
            <button class="btn btn-light" id="heroCta" onclick="onHeroCtaClick()">Shop now →</button>
          </div>
          <div class="emoji">🛍️</div>
        </div>
        <div class="section-title"><h2>Shop by category</h2></div>
        <div class="cats">${categories.map(c => `
          <div class="cat-card" onclick="go('/category/${c.id}')"><div class="ic">${c.icon}</div><div>${c.name}</div></div>`).join('')}</div>
        <div class="section-title"><h2>Featured products</h2></div>
        <div class="grid" id="featuredGrid">${products.filter((_, i) => i % 2 === 0).slice(0, 8).map(productCard).join('')}</div>
        <div class="perks">
          <div class="perk"><b>🚚 Fast delivery</b>Delivered in 2–4 business days.</div>
          <div class="perk"><b>↩️ Easy returns</b>30-day hassle-free returns.</div>
          <div class="perk"><b>🔒 Secure checkout</b>Guest checkout available — no account needed.</div>
        </div>`;
      applyPendingHero();
      pageViewed('Home');
    }

    function viewCategory(app, catId) {
      const c = catById(catId);
      if (!c) return go('/');
      const list = products.filter(p => p.cat === c.id);
      app.innerHTML = `<div class="crumbs"><a onclick="go('/')">Home</a> › ${c.name}</div>
        <h1 class="page-title">${c.icon} ${c.name}</h1>
        <div class="grid">${list.map(productCard).join('')}</div>`;
      pageViewed('Category', { category: c.name });
      trackEvent('Category Viewed', { category_id: c.id, category_name: c.name, product_count: list.length });
    }

    function doSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (q) go('/search/' + encodeURIComponent(q));
    }
    function viewSearch(app, q) {
      const ql = q.toLowerCase();
      const list = products.filter(p => (p.name + ' ' + catById(p.cat).name + ' ' + p.desc).toLowerCase().includes(ql));
      app.innerHTML = `<h1 class="page-title">Results for “${esc(q)}” <span style="font-size:15px;color:var(--muted)">(${list.length})</span></h1>
        ${list.length ? `<div class="grid">${list.map(productCard).join('')}</div>` : '<div class="empty">No products found. Try “headphones” or “yoga”.</div>'}`;
      pageViewed('Search Results', { query: q });
      trackEvent('Search Performed', { query: q, result_count: list.length });
    }

    let pdpQty = 1;
    function viewProduct(app, id) {
      const p = prodById(id);
      if (!p) return go('/');
      pdpQty = 1;
      const off = Math.round((1 - p.price / p.mrp) * 100);
      app.innerHTML = `<div class="crumbs"><a onclick="go('/')">Home</a> › <a onclick="go('/category/${p.cat}')">${catById(p.cat).name}</a> › ${esc(p.name)}</div>
        <div class="pdp">
          <div class="pimg" style="background:${catById(p.cat).bg}">${p.icon}</div>
          <div>
            <div class="pcat">${catById(p.cat).name}</div>
            <h1>${esc(p.name)}</h1>
            <div class="rating">★ ${p.rating} <span>(${p.reviews} reviews)</span></div>
            <div class="price">${money(p.price)}<s>${money(p.mrp)}</s><span class="off">${off}% off</span></div>
            <p>${esc(p.desc)}</p>
            <p>✔ In stock &nbsp; ✔ Free returns &nbsp; ✔ Ships in 24h</p>
            <div style="display:flex;gap:12px;align-items:center;margin-top:18px">
              <div class="qty"><button onclick="pdpChange(-1)">−</button><span id="pdpQty">1</span><button onclick="pdpChange(1)">+</button></div>
              <button class="btn btn-primary" onclick="addToCart('${p.id}', pdpQty)">Add to cart</button>
              <button class="btn btn-accent" onclick="addToCart('${p.id}', pdpQty);startCheckout()">Buy now</button>
            </div>
          </div>
        </div>
        <div class="section-title"><h2>You may also like</h2></div>
        <div class="grid">${products.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 4).map(productCard).join('')}</div>`;
      pageViewed('Product Detail', { product_id: p.id });
      trackEvent('Product Viewed', productProps(p));
    }
    function pdpChange(d) { pdpQty = Math.max(1, pdpQty + d); document.getElementById('pdpQty').textContent = pdpQty; }

    // ───────── Auth ─────────
    function renderAuth() {
      document.getElementById('authArea').innerHTML = session
        ? `<button class="hbtn" title="${esc(session.email)}">👤 ${esc(session.name.split(' ')[0])}</button><button class="hbtn" onclick="logout()">Logout</button>`
        : `<button class="hbtn" onclick="go('/login')">Login</button><button class="hbtn" onclick="go('/register')" style="color:var(--primary)">Register</button>`;
    }
    const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    const phoneOk = p => /^\+[1-9]\d{7,14}$/.test(p);

    function viewLogin(app) {
      app.innerHTML = `<div class="form-card">
        <h1>Welcome back</h1><div class="sub">Demo login: just enter an Identity and Email. No password needed.</div>
        <label>Identity</label><input type="text" id="lIdentity" placeholder="e.g. user123">
        <label>Email</label><input type="email" id="lEmail" placeholder="you@example.com" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="err" id="lErr"></div>
        <button class="btn btn-primary btn-block" onclick="doLogin()">Log in</button>
        <div class="alt">New here? <a onclick="go('/register')">Create an account</a></div>
      </div>`;
      pageViewed('Login');
    }
    function doLogin() {
      const identity = document.getElementById('lIdentity').value.trim();
      const email = document.getElementById('lEmail').value.trim().toLowerCase();
      const err = document.getElementById('lErr');
      if (!identity) { err.textContent = 'Please enter an Identity.'; return; }
      if (!emailOk(email)) { err.textContent = 'Please enter a valid email.'; return; }
      const known = users.find(u => u.identity === identity) || {};
      const name = known.name || identity;
      session = { name, email, phone: known.phone || '', identity };
      save('demo_session', session);
      ctLogin({ Identity: identity, Email: email });
      trackEvent('Login', { method: 'identity_email', identity, email });
      renderAuth(); showToast('Welcome back, ' + name.split(' ')[0]);
      go(cart.length ? '/checkout' : '/');
    }

    function viewRegister(app) {
      app.innerHTML = `<div class="form-card">
        <h1>Create account</h1><div class="sub">Demo registration. No password needed.</div>
        <label>Full name</label><input type="text" id="rName" placeholder="Jane Doe">
        <label>Identity</label><input type="text" id="rIdentity" placeholder="e.g. user123">
        <label>Email</label><input type="email" id="rEmail" placeholder="you@example.com">
        <label>Phone (with country code)</label><input type="tel" id="rPhone" placeholder="+919876543210">
        <div class="err" id="rErr"></div>
        <button class="btn btn-primary btn-block" onclick="doRegister()">Register</button>
        <div class="alt">Already have an account? <a onclick="go('/login')">Log in</a></div>
      </div>`;
      pageViewed('Register');
    }
    function doRegister() {
      const name = document.getElementById('rName').value.trim();
      const identity = document.getElementById('rIdentity').value.trim();
      const email = document.getElementById('rEmail').value.trim().toLowerCase();
      const phone = document.getElementById('rPhone').value.trim();
      const err = document.getElementById('rErr');
      if (!name) { err.textContent = 'Please enter your name.'; return; }
      if (!identity) { err.textContent = 'Please enter an Identity.'; return; }
      if (!emailOk(email)) { err.textContent = 'Please enter a valid email.'; return; }
      if (phone && !phoneOk(phone)) { err.textContent = 'Phone must include country code, e.g. +919876543210.'; return; }
      users = users.filter(u => u.identity !== identity);
      users.push({ identity, name, email, phone });
      save('demo_users', users);
      session = { name, email, phone, identity };
      save('demo_session', session);
      const profile = { Identity: identity, Name: name, Email: email };
      if (phone) profile.Phone = phone;
      ctLogin(profile);
      trackEvent('Register', { method: 'identity_email', identity, email });
      renderAuth(); showToast('Account created. Welcome, ' + name.split(' ')[0] + '!');
      go(cart.length ? '/checkout' : '/');
    }
    function logout() {
      trackEvent('Logout', {});
      session = null; save('demo_session', null);
      renderAuth(); showToast('Logged out'); go('/');
    }

    // ───────── Checkout ─────────
    let payMode = 'Credit Card';
    function viewCheckout(app) {
      if (!cart.length) {
        app.innerHTML = '<div class="empty"><div style="font-size:60px">🛒</div><h2>Your cart is empty</h2><button class="btn btn-primary" onclick="go(\'/\')">Continue shopping</button></div>';
        pageViewed('Checkout (empty cart)'); return;
      }
      const t = cartTotals();
      const s = session || {};
      app.innerHTML = `<h1 class="page-title">Checkout</h1>
        <div class="checkout">
          <div>
            <div class="panel">
              ${session
                ? `<h2>Contact details</h2><div style="margin-bottom:6px"><span class="tag">Logged in</span></div>`
                : `<h2>Guest checkout</h2><div style="font-size:14px;color:var(--muted)">No account needed. Already a customer? <a onclick="go('/login')">Log in</a> · <a onclick="go('/register')">Register</a></div>`}
              <div class="row2"><div><label>Full name</label><input type="text" id="cName" value="${esc(s.name || '')}" placeholder="Jane Doe"></div>
              <div><label>Phone (with country code)</label><input type="tel" id="cPhone" value="${esc(s.phone || '')}" placeholder="+919876543210"></div></div>
              <label>Email</label><input type="email" id="cEmail" value="${esc(s.email || '')}" placeholder="you@example.com">
            </div>
            <div class="panel" style="margin-top:18px">
              <h2>Shipping address</h2>
              <label>Address</label><input type="text" id="cAddr" placeholder="221B Baker Street">
              <div class="row2"><div><label>City</label><input type="text" id="cCity" placeholder="Mumbai"></div>
              <div><label>PIN / ZIP</label><input type="text" id="cZip" placeholder="400001"></div></div>
            </div>
            <div class="panel" style="margin-top:18px">
              <h2>Payment (demo)</h2>
              <label>Payment mode</label>
              <select id="cPay" onchange="payMode=this.value"><option>Credit Card</option><option>Debit Card</option><option>UPI</option><option>Net Banking</option><option>Cash on Delivery</option></select>
            </div>
            <div class="err" id="cErr"></div>
          </div>
          <div class="panel">
            <h2>Order summary</h2>
            ${cart.map(i => { const p = prodById(i.id); return `<div class="mini"><div class="em" style="background:${catById(p.cat).bg}">${p.icon}</div><div class="grow">${esc(p.name)}<br><span style="color:var(--muted)">Qty ${i.qty}</span></div><b>${money(p.price * i.qty)}</b></div>`; }).join('')}
            <div class="sum-line"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
            <div class="sum-line"><span>Shipping</span><span>${t.shipping ? money(t.shipping) : 'FREE'}</span></div>
            <div class="sum-line total"><span>Total</span><span>${money(t.total)}</span></div>
            <button class="btn btn-accent btn-block" style="margin-top:14px" onclick="placeOrder()">${session ? 'Place order' : 'Place order as guest'}</button>
          </div>
        </div>`;
      document.getElementById('cPay').value = payMode;
      pageViewed('Checkout', { cart_value: t.total, is_guest: !session });
      trackEvent('Checkout Started', { item_count: t.items, cart_value: t.total, is_guest: !session });
    }

    function placeOrder() {
      const name = document.getElementById('cName').value.trim();
      const email = document.getElementById('cEmail').value.trim().toLowerCase();
      const phone = document.getElementById('cPhone').value.trim();
      const addr = document.getElementById('cAddr').value.trim();
      const city = document.getElementById('cCity').value.trim();
      const zip = document.getElementById('cZip').value.trim();
      const err = document.getElementById('cErr');
      if (!name) { err.textContent = 'Please enter your name.'; return; }
      if (!emailOk(email)) { err.textContent = 'Please enter a valid email.'; return; }
      if (!phoneOk(phone)) { err.textContent = 'Phone must include country code, e.g. +919876543210.'; return; }
      if (!addr || !city || !zip) { err.textContent = 'Please complete the shipping address.'; return; }

      const t = cartTotals();
      const orderId = 'ORD' + Date.now().toString(36).toUpperCase();
      const items = cart.map(i => { const p = prodById(i.id); return { id: p.id, name: p.name, category: catById(p.cat).name, price: p.price, qty: i.qty }; });

      if (!session) {
        // Guest checkout — onUserLogin WITHOUT an Identity (CleverTap matches on Email / Phone)
        ctLogin({ Name: name, Email: email, Phone: phone });
        trackEvent('Guest Checkout', { name, email, phone, cart_value: t.total, item_count: t.items, payment_mode: payMode });
      }

      // CleverTap Charged event
      trackEvent('Charged', {
        'Amount': Number(t.total.toFixed(2)),
        'Payment mode': payMode,
        'Charged ID': orderId,
        'Delivery city': city,
        'Is guest': !session,
        'Items': items.map(i => ({ 'Product id': i.id, 'Product name': i.name, 'Category': i.category, 'Price': i.price, 'Quantity': i.qty }))
      });

      const order = { id: orderId, name, email, phone, addr, city, zip, payMode, items, totals: t, guest: !session };
      save('demo_last_order', order);
      cart = []; save('demo_cart', cart); renderCart();
      go('/order/' + orderId);
    }

    function viewOrder(app, id) {
      const o = load('demo_last_order', null);
      if (!o || o.id !== id) return go('/');
      app.innerHTML = `<div class="success">
        <div class="big">✅</div><h1>Thank you, ${esc(o.name.split(' ')[0])}!</h1>
        <p>Your order <b>${esc(o.id)}</b> has been placed${o.guest ? ' as a guest' : ''}. A confirmation will be sent to <b>${esc(o.email)}</b>.</p>
        <div style="text-align:left;margin:20px 0">${o.items.map(i => `<div class="sum-line"><span>${esc(i.name)} × ${i.qty}</span><span>${money(i.price * i.qty)}</span></div>`).join('')}
        <div class="sum-line total"><span>Total paid (${esc(o.payMode)})</span><span>${money(o.totals.total)}</span></div></div>
        ${o.guest ? '<p style="font-size:14px;color:var(--muted)">Want to track orders faster next time? <a onclick="go(\'/register\')">Create an account</a></p>' : ''}
        <button class="btn btn-primary" onclick="go('/')">Continue shopping</button>
      </div>`;
      pageViewed('Order Confirmation', { order_id: o.id });
    }

    // ───────── Push / Inbox bell ─────────
    // Permission must be requested directly inside the click handler (required by iOS), so no auto-prompt on load.
    function enablePush() {
      if (typeof Notification === 'undefined') {
        showToast('Push not supported here (on iOS, install from Safari)');
        trackEvent('Push Permission Result', { permission: 'unsupported' });
        return;
      }
      Notification.requestPermission().then(permission => {
        console.log('Push notification permission:', permission);
        showToast('Push permission: ' + permission);
        trackEvent('Push Permission Result', { permission });
        if (permission === 'granted') {
          // Permission is granted, so register this browser with CleverTap without showing its soft prompt again
          clevertap.notifications.push({ skipDialog: true });
        }
      });
    }
    function resetPushPrompt() {
      Object.keys(localStorage).forEach(k => { if (/wzrk|notif/i.test(k)) localStorage.removeItem(k); });
      showToast('Push prompt state reset.');
    }
    window.resetPushPrompt = resetPushPrompt;
    function setBellBadge(count) {
      const b = document.getElementById('notification_bell_badge');
      if (!b) return;
      b.textContent = count; b.classList.toggle('show', count > 0);
    }
    window.setBellBadge = setBellBadge;

    // ───────── Hero banner (CleverTap Native Display, topic = home_page_banner) ─────────
    let heroState = { topic: 'home_page_banner', title: 'Big savings on everyday essentials', body: '', button_text: 'Shop now', source: 'default' };
    let pendingHeroContent = null;

    function applyHomeBanner(content) {
      if (!content) return;
      const titleEl = document.getElementById('heroTitle'), bodyEl = document.getElementById('heroBody'), ctaEl = document.getElementById('heroCta');
      if (!titleEl || !bodyEl || !ctaEl) { pendingHeroContent = content; return; }  // hero not on screen — replay on next home render
      if (content.title) titleEl.textContent = content.title;
      if (content.body) bodyEl.textContent = content.body;
      if (content.button_text) ctaEl.textContent = content.button_text + ' →';
      heroState = { topic: 'home_page_banner', title: content.title || heroState.title, body: content.body || heroState.body, button_text: content.button_text || heroState.button_text, source: 'clevertap_native_display' };
      trackEvent('Native Display Rendered', { topic: 'home_page_banner', title: heroState.title, button_text: heroState.button_text });
    }
    function applyPendingHero() {
      if (pendingHeroContent) { const c = pendingHeroContent; pendingHeroContent = null; applyHomeBanner(c); }
    }
    function onHeroCtaClick() {
      trackEvent('Hero CTA Clicked', { cta: heroState.button_text, topic: heroState.topic, title: heroState.title, source: heroState.source });
      document.getElementById('featuredGrid').scrollIntoView({ behavior: 'smooth' });
    }
    document.addEventListener('CT_web_native_display', function (event) {
      try {
        if (event.detail && window.clevertap.renderNotificationViewed) clevertap.renderNotificationViewed(event.detail);
        let payloads = event.detail; if (!payloads) return;
        if (!Array.isArray(payloads)) payloads = [payloads];
        payloads.forEach(p => {
          const content = (p && (p.msgContent || p.kv)) || p || {};
          if ((content.topic || (p && p.topic)) === 'home_page_banner') applyHomeBanner(content);
        });
      } catch (e) { console.warn('Failed to process CT_web_native_display payload', e); }
    });

    // ───────── Boot ─────────
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('catNav').innerHTML =
        '<a onclick="go(\'/\')">All</a>' + categories.map(c => `<a data-id="${c.id}" onclick="go('/category/${c.id}')">${c.icon} ${c.name}</a>`).join('');
      renderAuth();
      renderCart();
      route();
    });
  </script>
</body>
</html>
