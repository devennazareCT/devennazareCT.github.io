<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Push Test</title>
<style>body{font-family:-apple-system,sans-serif;margin:16px}button{font-size:16px;padding:12px 16px;margin:6px 0}textarea{width:100%;height:180px;font-size:12px}</style>
</head><body>
<h3>Web Push test (own VAPID key)</h3>
<p id="info"></p>
<button id="go">Subscribe</button>
<p>Subscription JSON — copy into push-test-server/subscription.json:</p>
<textarea id="out" readonly></textarea>
<script>
const PUBLIC_KEY = 'BCoTiZJ_VVN6Xa4fTq_wmKjGLibyDeexz1jcVURtEsVsM9dB173eJvmAusKUZHWE6pA-1jTBuzJC1pvUMrGthX4';
const b64 = s => { const p='='.repeat((4-s.length%4)%4); const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(r,c=>c.charCodeAt(0)); };
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
document.getElementById('info').textContent = 'Standalone PWA: ' + standalone + ' | UA: ' + navigator.userAgent;
document.getElementById('go').onclick = async () => {
  const out = document.getElementById('out');
  try {
    const perm = await Notification.requestPermission();   // inside the tap handler for iOS
    if (perm !== 'granted') { out.value = 'Permission: ' + perm; return; }
    await navigator.serviceWorker.register('/push-test/sw.js', { scope: '/push-test/' });
    const reg = await navigator.serviceWorker.ready.then(() => navigator.serviceWorker.getRegistration('/push-test/'));
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(PUBLIC_KEY) });
    out.value = JSON.stringify(sub.toJSON(), null, 2);
    console.log('Push endpoint:', sub.endpoint);
  } catch (e) { out.value = 'Error: ' + e; console.error(e); }
};
</script></body></html>
